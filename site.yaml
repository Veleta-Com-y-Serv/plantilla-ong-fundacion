  sobre:
    activa: true
    antetitulo: Quiénes somos
    titulo: "Una fundación pequeña, de barrio."
    titulo_destacado: de barrio.
    texto: "Nacimos en 2006 en el barrio de Pumarín, cuando un grupo de vecinas empezó a llamar cada tarde a las personas mayores de su portal. Hoy somos una fundación con equipo propio y cientos de voluntarios, pero seguimos trabajando igual: casa por casa y con nombre propio.\n\nTrabajamos con los servicios sociales del Ayuntamiento, los centros de salud y las parroquias para llegar a quien más lo necesita y no duplicar ayudas."
    imagen: /fotos/sobre.jpg
    items:
