  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntan antes de colaborar
    preguntas:
      - { pregunta: "¿Mi donativo desgrava?", respuesta: "Sí. Somos una fundación acogida a la ley de mecenazgo: te enviamos el certificado y lo deduces en la declaración de la renta. Solo necesitamos tu nombre completo y tu DNI." }
      - { pregunta: "¿Cuánto tiempo hace falta para ser voluntario?", respuesta: "Con dos horas a la semana es suficiente. Antes de empezar hacemos una formación de una tarde y la primera visita la haces acompañado." }
      - { pregunta: "¿Puedo darme de baja como socio cuando quiera?", respuesta: "Sí, en cualquier momento y sin dar explicaciones. Basta con un correo o una llamada." }
      - { pregunta: "¿Cómo pido ayuda para un familiar o un vecino?", respuesta: "Llámanos o escríbenos. Una trabajadora social te llamará en pocos días para conocer la situación y ver cómo podemos ayudar." }
      - { pregunta: "¿Aceptáis donaciones de ropa o muebles?", respuesta: "Ahora mismo solo alimentos no perecederos y productos de higiene. Si tienes otra cosa, pregúntanos y te decimos a qué entidad le puede servir." }

